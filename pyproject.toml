[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "aws-lambda-example"
version = "0.1.0"
description = "Practical AWS Lambda handler patterns: API Gateway, SQS, S3, EventBridge — with a tiny router, middleware, response helpers, and an offline local-invoke harness."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Viprasol Tech Private Limited", email = "support@viprasol.com" }]
keywords = ["aws", "lambda", "serverless", "api-gateway", "sqs", "s3", "eventbridge", "handler", "middleware"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = []

[project.optional-dependencies]
aws = ["boto3>=1.34"]
dev = ["ruff>=0.6", "mypy>=1.11", "pytest>=8.0"]

[project.urls]
Homepage = "https://viprasol.com"
Repository = "https://github.com/Viprasol-Tech/aws-lambda-example"
Issues = "https://github.com/Viprasol-Tech/aws-lambda-example/issues"

[project.scripts]
lambda-invoke = "aws_lambda_example.harness:main"

[tool.hatch.build.targets.wheel]
packages = ["src/aws_lambda_example"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "RUF"]
# BadRequest / NotFound are intentional HTTP-style exception names.
ignore = ["N818"]

[tool.mypy]
python_version = "3.11"
strict = true
files = ["src"]

[[tool.mypy.overrides]]
module = "boto3.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
